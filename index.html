<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三个数 · 每天记一笔</title>
<style>
  :root {
    /* 纸色底 + 暖近黑字：比纯白纯黑柔，屏幕上看久不累 */
    --bg: #f7f4ef;
    --fg: #26221e;
    --dim: #7d766d;
    --line: #e0dad0;
    /* 两个低饱和色相，各四档浓度表示量级（像 GitHub 的贡献格子） */
    --a1: #ecd9d5;  --a2: #d8b3ac;  --a3: #c78679;  --a4: #b0574a;   /* 抖音 · 赭红 */
    --b1: #d9e6df;  --b2: #aacdc0;  --b3: #78b09b;  --b4: #3f7d63;   /* 创作 · 松绿 */
    --font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  /* 晚上自动转深色：记入睡时间时不该被白屏刺到 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e6e3dd;
      --dim: #8f8a82;
      --line: #2a2d33;
      --a1: #35292a;  --a2: #5b3a37;  --a3: #8d5148;  --a4: #c87666;
      --b1: #22302b;  --b2: #35544a;  --b3: #4d8770;  --b4: #7fc0a4;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto; max-width: 640px;
    padding: 30px 18px calc(40px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 var(--font);
  }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: .22em; margin: 0 0 6px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 30px; letter-spacing: .02em; }
  /* 卡片不再是一个"盒子"，而是一条粗线分隔的一段 */
  .card { border-top: 2px solid var(--fg); padding-top: 13px; margin-bottom: 30px; }
  .card > h2 {
    font-size: 11px; font-weight: 600; letter-spacing: .18em;
    color: var(--dim); margin: 0 0 16px;
  }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; letter-spacing: .04em; }
  .row { display: flex; gap: 10px; align-items: baseline; }
  input[type="number"], input[type="time"], input[type="date"] {
    flex: 1; width: 100%; padding: 9px 2px; font: inherit;
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
    color: var(--fg); background: transparent;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-bottom-color: var(--fg); }
  input::placeholder { color: var(--line); }
  .field { margin-bottom: 18px; }
  .unit { color: var(--dim); font-size: 12px; min-width: 32px; }
  button {
    width: 100%; padding: 12px; font: inherit; font-weight: 600; letter-spacing: .1em;
    color: var(--bg); background: var(--fg);
    border: 1px solid var(--fg); border-radius: 0; cursor: pointer;
  }
  button:active { opacity: .72; }
  button.ghost {
    color: var(--fg); background: transparent; border: 1px solid var(--line);
    font-weight: 400; font-size: 13px; padding: 10px; letter-spacing: .06em;
  }
  button.ghost:active { border-color: var(--fg); opacity: 1; }
  .ok { color: var(--dim); font-size: 12px; height: 18px; margin-top: 10px; }
  .grid { display: flex; gap: 10px; }
  .grid > * { flex: 1; }
  /* ---- 方块格子（代替原来的彩色柱状图）---- */
  .hmrow { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .hmlabel { flex: none; width: 92px; font-size: 11px; color: var(--dim); line-height: 1.35; }
  .hmcells { flex: 1; display: flex; gap: 6px; }
  .hmcell { flex: 1; aspect-ratio: 1; border: 1px solid var(--line); }
  .a1 { background: var(--a1); border-color: transparent; }
  .a2 { background: var(--a2); border-color: transparent; }
  .a3 { background: var(--a3); border-color: transparent; }
  .a4 { background: var(--a4); border-color: transparent; }
  .b1 { background: var(--b1); border-color: transparent; }
  .b2 { background: var(--b2); border-color: transparent; }
  .b3 { background: var(--b3); border-color: transparent; }
  .b4 { background: var(--b4); border-color: transparent; }
  .xlabels { flex: 1; display: flex; gap: 6px; margin-top: 2px; }
  .xlabels div { flex: 1; text-align: center; font-size: 10px; color: var(--dim); }
  .shadekey { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); }
  .shadekey i { display: block; width: 11px; height: 11px; border: 1px solid var(--line); }
  .shadekey .gap { width: 12px; }
  /* ---- 表格 ---- */
  table { border-collapse: collapse; width: 100%; margin-top: 20px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 4px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; color: var(--dim); }
  thead th { color: var(--dim); font-weight: 400; font-size: 11px; letter-spacing: .1em; border-bottom: 1px solid var(--fg); }
  tbody tr:last-child td { border-bottom: 0; }
  /* ---- 小结 ---- */
  .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat span { color: var(--dim); }
  .stat b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--dim); line-height: 1.9; border-top: 2px solid var(--fg); padding-top: 14px; }
  /* 危险按钮不用红色，用虚线区分——黑白版里不引入第二颜色 */
  .danger { border-style: dashed; }
</style>
</head>
<body>

  <h1>三个数</h1>
  <div class="sub">每天记一笔 · 抖音 / 创作 / 入睡 —— 数据只存在这台设备的浏览器里</div>

  <!-- 1. 记今天的数 -->
  <div class="card">
    <h2>记今天的数</h2>
    <div class="field">
      <label>日期</label>
      <input type="date" id="date">
    </div>
    <div class="field">
      <label>抖音 · 越少越好 ↓（分钟）</label>
      <div class="row">
        <input type="number" id="douyin" min="0" step="1" placeholder="0" inputmode="numeric">
        <span class="unit">分钟</span>
      </div>
    </div>
    <div class="field">
      <label>创作 · 越多越好 ↑（分钟）</label>
      <div class="row">
        <input type="number" id="create" min="0" step="1" placeholder="0" inputmode="numeric">
        <span class="unit">分钟</span>
      </div>
    </div>
    <div class="field">
      <label>入睡时间</label>
      <div class="row">
        <input type="time" id="sleep">
        <span class="unit">点</span>
      </div>
    </div>
    <button id="save">保存这一天</button>
    <div class="ok" id="ok"></div>
  </div>

  <!-- 2. 最近 7 天 -->
  <div class="card">
    <h2>最近 7 天 · 单位：分钟</h2>
    <div class="hmrow">
      <span class="hmlabel">抖音 ↓</span>
      <div class="hmcells" id="hm-douyin"></div>
    </div>
    <div class="hmrow">
      <span class="hmlabel">创作 ↑</span>
      <div class="hmcells" id="hm-create"></div>
    </div>
    <div class="hmrow">
      <span class="hmlabel"></span>
      <div class="xlabels" id="xlabels"></div>
    </div>
    <div class="hmrow">
      <span class="hmlabel">浓度 = 多少</span>
      <div class="shadekey">
        <span>抖音</span>
        <i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i>
        <span class="gap"></span>
        <span>创作</span>
        <i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>日期</th><th>抖音</th><th>创作</th><th>入睡</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- 3. 小结 -->
  <div class="card">
    <h2>这 7 天的小结</h2>
    <div id="stats"></div>
  </div>

  <!-- 4. 目标 + 备份 -->
  <div class="card">
    <h2>设置与备份</h2>
    <div class="field">
      <label>抖音每日上限（分钟）</label>
      <input type="number" id="goal" min="0" step="5">
    </div>
    <div class="grid">
      <button class="ghost" id="export">导出备份</button>
      <button class="ghost" id="import">导入备份</button>
    </div>
    <div style="height:10px"></div>
    <button class="ghost danger" id="wipe">清空全部记录</button>
  </div>

  <div class="note">
    <b>数据存在哪？</b>存在浏览器的 localStorage 里，也就是这个浏览器的本地存储。
    它不联网、不上传、换一台设备就看不到。这意味着：<b>清浏览器数据会把它一起清掉</b>，
    所以每周点一次「导出备份」，存个文件。第 2 周我们会把它搬到真正的后端（Supabase），
    那时候就换设备也能看见了。
  </div>

<script>
// ============================================================
// 这个小工具的全部逻辑：读 → 改 → 存
// 存储用浏览器的 localStorage，键名 useback.v1
// ============================================================

const KEY = "useback.v1";              // 存储的键名
const DEFAULT_GOAL = 120;              // 抖音每日上限（分钟）

// 把存储里的整块数据读出来
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { goal: DEFAULT_GOAL, days: {} };
    const data = JSON.parse(raw);
    return { goal: data.goal || DEFAULT_GOAL, days: data.days || {} };
  } catch (e) {
    return { goal: DEFAULT_GOAL, days: {} };
  }
}

// 把整块数据写回去
function save(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
}

const $ = (id) => document.getElementById(id);

// 今天，按本地时区写成 YYYY-MM-DD
function todayStr(d) {
  const t = d || new Date();
  const p = (n) => String(n).padStart(2, "0");
  return t.getFullYear() + "-" + p(t.getMonth() + 1) + "-" + p(t.getDate());
}

function shiftDay(dateStr, delta) {
  const d = new Date(dateStr + "T12:00:00");
  d.setDate(d.getDate() + delta);
  return todayStr(d);
}

// 最近 n 天的日期（含今天），从旧到新
function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(shiftDay(todayStr(), -i));
  return out;
}

function shortLabel(dateStr) {
  const [, m, d] = dateStr.split("-");
  return Number(m) + "/" + Number(d);
}

// ---------------- 渲染 ----------------
let data = load();
let currentDate = todayStr();

function render() {
  // 日期框里的那天，如果已经有记录，就把数值填进去（方便改）
  const rec = data.days[currentDate] || {};
  $("douyin").value = rec.douyin ?? "";
  $("create").value = rec.create ?? "";
  $("sleep").value = rec.sleep ?? "";
  $("goal").value = data.goal;

  const days = lastDays(7);
  const rows = days.map((d) => ({ date: d, ...(data.days[d] || {}) }));
  const maxMin = Math.max(60, ...rows.map((r) => Math.max(r.douyin || 0, r.create || 0)));

  // 方块格子：两个指标共用一把尺子（maxMin），深浅表示量级
  const lvl = (v) => {
    if (typeof v !== "number" || v <= 0) return 0;
    const r = v / maxMin;
    if (r <= 0.25) return 1;
    if (r <= 0.5) return 2;
    if (r <= 0.75) return 3;
    return 4;
  };
  const cells = (items) =>
    items
      .map(
        (it) =>
          '<div class="hmcell' + (it.v > 0 ? " " + it.h + it.v : "") +
          '" title="' + it.t + '"></div>'
      )
      .join("");
  $("hm-douyin").innerHTML = cells(
    rows.map((r) => ({ h: "a", v: lvl(r.douyin), t: r.date + " 抖音 " + (r.douyin ?? "—") + " 分钟" }))
  );
  $("hm-create").innerHTML = cells(
    rows.map((r) => ({ h: "b", v: lvl(r.create), t: r.date + " 创作 " + (r.create ?? "—") + " 分钟" }))
  );
  $("xlabels").innerHTML = days.map((d) => "<div>" + shortLabel(d) + "</div>").join("");

  // 表格
  $("tbody").innerHTML = rows
    .map(
      (r) =>
        "<tr><td>" +
        shortLabel(r.date) +
        "</td><td>" +
        (r.douyin ?? "–") +
        "</td><td>" +
        (r.create ?? "–") +
        "</td><td>" +
        (r.sleep || "–") +
        "</td></tr>"
    )
    .join("");

  // 小结
  const withDouyin = rows.filter((r) => typeof r.douyin === "number");
  const avg = withDouyin.length
    ? Math.round(withDouyin.reduce((s, r) => s + r.douyin, 0) / withDouyin.length)
    : null;
  const under = withDouyin.filter((r) => r.douyin <= data.goal).length;
  const createSum = rows.reduce((s, r) => s + (r.create || 0), 0);
  const sleeps = rows.map((r) => r.sleep).filter(Boolean).sort();
  const medianSleep = sleeps.length ? sleeps[Math.floor(sleeps.length / 2)] : "–";
  const filled = rows.filter((r) => r.douyin !== undefined || r.create !== undefined).length;

  $("stats").innerHTML =
    stat("这 7 天记了", filled + " / 7 天") +
    stat("抖音日均", avg === null ? "–" : avg + " 分钟") +
    stat("达标天数（≤" + data.goal + "）", under + " / " + withDouyin.length) +
    stat("创作合计", createSum + " 分钟") +
    stat("入睡中位数", medianSleep);
}

function stat(k, v) {
  return '<div class="stat"><span>' + k + "</span><b>" + v + "</b></div>";
}

function flash(msg) {
  $("ok").textContent = msg;
  setTimeout(() => { $("ok").textContent = ""; }, 2200);
}

// ---------------- 交互 ----------------
$("date").addEventListener("change", (e) => {
  currentDate = e.target.value || todayStr();
  render();
});

$("save").addEventListener("click", () => {
  const rec = {
    douyin: $("douyin").value === "" ? undefined : Number($("douyin").value),
    create: $("create").value === "" ? undefined : Number($("create").value),
    sleep: $("sleep").value || undefined,
    savedAt: new Date().toISOString(),
  };
  // 三个都空 = 删掉这天的记录
  if (rec.douyin === undefined && rec.create === undefined && rec.sleep === undefined) {
    delete data.days[currentDate];
  } else {
    data.days[currentDate] = rec;
  }
  save(data);
  render();
  flash("已保存 " + currentDate);
});

$("goal").addEventListener("change", () => {
  data.goal = Number($("goal").value) || DEFAULT_GOAL;
  save(data);
  render();
});

$("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "三个数-备份-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  flash("备份文件已下载");
});

$("import").addEventListener("click", () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = () => {
    const f = input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const incoming = JSON.parse(reader.result);
        if (!incoming.days) throw new Error("格式不对");
        data = { goal: incoming.goal || DEFAULT_GOAL, days: { ...data.days, ...incoming.days } };
        save(data);
        render();
        flash("已合并导入");
      } catch (e) {
        flash("这个文件读不了");
      }
    };
    reader.readAsText(f);
  };
  input.click();
});

$("wipe").addEventListener("click", () => {
  if (!confirm("确定清空全部记录？这个操作不能撤销。")) return;
  data = { goal: data.goal, days: {} };
  save(data);
  render();
  flash("已清空");
});

// 启动
$("date").value = currentDate;
render();
</script>
</body>
</html>
